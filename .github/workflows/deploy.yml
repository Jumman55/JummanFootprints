# Publishes the site to GitHub Pages.
#  - Every push to main: build and publish.
#  - Every hour: check the YouTube channel; if there is a new video, save it to
#    src/data/youtube-videos.json, then build and publish. If nothing is new, nothing happens.
#  - "Run workflow" button on the Actions tab: check YouTube and publish now.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # every hour, at minute 17
  workflow_dispatch:

permissions:
  contents: write # to save new videos into the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-youtube:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      added: ${{ steps.sync.outputs.added }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check YouTube for new videos
        id: sync
        run: node scripts/sync-youtube.mjs
      - name: Save new videos
        if: steps.sync.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/youtube-videos.json
          git commit -m "Add new YouTube video(s) from the channel"
          git push

  publish:
    needs: sync-youtube
    # Publish on push, on the manual button, or when the hourly check found something new.
    if: >-
      always() && needs.sync-youtube.result != 'failure' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.sync-youtube.outputs.added != '0'
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # includes a video the sync step just saved
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
